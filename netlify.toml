[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- API routes -> functions (specific before general) ---
#
# Ingest has no route: it is a library (lib/ingest.js) run from the CLI,
# never an endpoint. See that file for why.

[[redirects]]
  from = "/api/sightings/:id"
  to = "/.netlify/functions/sightings-admin/:id"
  status = 200

[[redirects]]
  from = "/api/sightings"
  to = "/.netlify/functions/get-sightings"
  status = 200

[[redirects]]
  from = "/api/newsletters"
  to = "/.netlify/functions/get-newsletters"
  status = 200

[[redirects]]
  from = "/api/landmarks"
  to = "/.netlify/functions/get-landmarks"
  status = 200

[[redirects]]
  from = "/api/gazetteer/*"
  to = "/.netlify/functions/gazetteer/:splat"
  status = 200

[[redirects]]
  from = "/api/gazetteer"
  to = "/.netlify/functions/gazetteer"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
